<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b4332" />
  <title>AgriTrack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #154e35 0%, #0c2b1d 60%, #06170f 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #1b6343 0%, #0c2b1d 100%);
      border: 2px solid rgba(82, 183, 136, 0.55);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.6), 0 0 28px rgba(82, 183, 136, 0.35);
    }
    .logo-icon {
      width: 50px;
      height: 50px;
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .title .track {
      color: #52b788;
    }
    .subtitle {
      font-size: 14px;
      color: #b7e4c7;
      font-weight: 500;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .progress-bar {
      width: 120px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
      margin: 0 auto;
    }
    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #52b788 100%);
      animation: fill 1.2s infinite ease-in-out;
      border-radius: 99px;
    }
    @keyframes fill {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg class="logo-icon" viewBox="0 0 512 512" fill="none">
      <g transform="translate(256, 266)" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="0" y1="95" x2="0" y2="-20" />
        <line x1="-55" y1="95" x2="55" y2="95" />
        <path d="M0,-20 C0,-95 -75,-125 -75,-125 C-75,-125 -50,-45 0,-20" />
        <path d="M0,-20 C0,-95 75,-125 75,-125 C75,-125 50,-45 0,-20" />
      </g>
    </svg>
  </div>
  <h1 class="title">Agri<span class="track">Track</span></h1>
  <div class="subtitle">Smart Farm Ledger</div>
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>

  <script>
    const targetUrl = 'https://agri-track-smoky.vercel.app/';
    window.location.replace(targetUrl);
  </script>
</body>
</html>
